# Builds the desktop app for Windows, macOS and Linux on every push.
# Download the builds from the run's "Artifacts" section on GitHub.
# Push a tag like v0.1.0 to also attach them to a GitHub Release.
name: Build desktop app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            script: dist:win
            files: |
              release/*.exe
          - name: macOS
            os: macos-latest
            script: dist:mac
            files: |
              release/*.dmg
          - name: Linux
            os: ubuntu-latest
            script: dist:linux
            files: |
              release/*.AppImage
    env:
      # No signing certificates yet: build unsigned instead of failing.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build ${{ matrix.name }} app
        run: npm run ${{ matrix.script }}

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Credit-Note-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
